name: FailureLab incubator validation

on:
  pull_request:
    paths:
      - 'incubator/laravel-failurelab/**'
      - '.github/workflows/failurelab-incubator.yml'
  push:
    branches: [main]
    paths:
      - 'incubator/laravel-failurelab/**'
      - '.github/workflows/failurelab-incubator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    defaults:
      run:
        working-directory: incubator/laravel-failurelab
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: find src tests examples -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Dependency-free deterministic test engine
        run: php tests/smoke.php
      - name: Fake payment/webhook demo
        env:
          APP_ENV: testing
        run: php examples/payment-demo.php

  laravel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            laravel: '12'
            testbench: '10'
          - php: '8.4'
            laravel: '12'
            testbench: '10'
          - php: '8.4'
            laravel: '13'
            testbench: '11'
          - php: '8.5'
            laravel: '13'
            testbench: '11'
    defaults:
      run:
        working-directory: incubator/laravel-failurelab
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mbstring, dom, pdo_sqlite, sqlite3
          tools: composer:v2
      - name: Composer metadata
        run: composer validate --no-check-publish --strict
      - name: Resolve matching framework and Testbench
        run: |
          composer require --dev --no-update "laravel/framework:^${{ matrix.laravel }}" "orchestra/testbench:^${{ matrix.testbench }}"
          composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress
      - name: PHPUnit unit and Laravel integration tests
        run: vendor/bin/phpunit --configuration phpunit.xml.dist --fail-on-risky
      - name: Laravel Pint formatting (primary PHP/Laravel matrix)
        if: matrix.php == '8.4' && matrix.laravel == '13'
        run: vendor/bin/pint --test
      - name: Prepare offline Pint suggestions for review
        if: failure() && matrix.php == '8.4' && matrix.laravel == '13'
        run: |
          vendor/bin/pint
          git diff -- src tests examples > "$RUNNER_TEMP/pint-format.patch"
      - name: Upload Pint suggestions (never auto-commit)
        if: failure() && matrix.php == '8.4' && matrix.laravel == '13'
        uses: actions/upload-artifact@v4
        with:
          name: failurelab-pint-proposal-${{ github.run_id }}
          path: ${{ runner.temp }}/pint-format.patch
          if-no-files-found: error
          retention-days: 3

  source-archive:
    needs: [smoke, laravel]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Export canonical Composer package
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar --prefix=laravel-failurelab/ HEAD:incubator/laravel-failurelab | gzip -9 > dist/laravel-failurelab-prealpha.tar.gz
          # Avoid grep -q early pipe close with pipefail (tar may exit on SIGPIPE).
          tar -tzf dist/laravel-failurelab-prealpha.tar.gz > dist/archive-contents.txt
          grep -Fxq 'laravel-failurelab/composer.json' dist/archive-contents.txt
      - uses: actions/upload-artifact@v4
        with:
          name: failurelab-canonical-source-${{ github.sha }}
          path: dist/laravel-failurelab-prealpha.tar.gz
          if-no-files-found: error
          retention-days: 30
