name: Daily developer issue discovery

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: read-only-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover GitHub developer pain points
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m factory.cli --days 30 --output-dir artifacts
      - name: Upload reviewable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-discovery-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
