name: Sandboxed Codex Engineering Agent

on:
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:
  issues:
    types: [opened, labeled]
  push:
    branches: [main]
    paths:
      - '.github/workflows/codex-engineering.yml'

permissions:
  contents: read

concurrency:
  group: codex-engineering-${{ github.repository }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      issue_number: ${{ steps.pick.outputs.issue_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read owner-authored candidate tasks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state open --limit 100 --json number,title,body,author > "$RUNNER_TEMP/open-issues.json"
          gh pr list --state all --limit 100 --json headRefName > "$RUNNER_TEMP/pr-heads.json"
      - name: Select one bounded task
        id: pick
        run: |
          python -m factory.agent_queue select \
            --issues "$RUNNER_TEMP/open-issues.json" \
            --prs "$RUNNER_TEMP/pr-heads.json" \
            --task agent-task.md \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.pick.outputs.issue_number != ''
        with:
          name: selected-codex-task-${{ github.run_id }}
          path: agent-task.md
          if-no-files-found: error
          retention-days: 1

  generate:
    needs: select
    if: needs.select.outputs.issue_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
    outputs:
      patch_ready: ${{ steps.validate.outputs.patch_ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: selected-codex-task-${{ github.run_id }}
          path: .
      - name: Copy trusted validator before model edits
        run: cp factory/agent_queue.py "$RUNNER_TEMP/agent_queue_guard.py"
      - name: Explain missing inference credential
        if: env.HAS_OPENAI_KEY != 'true'
        run: |
          echo "::notice::OPENAI_API_KEY repository secret is required for unattended Codex generation. No PR was created."
      - name: Implement bounded maintenance task with Codex
        if: env.HAS_OPENAI_KEY == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          allow-bots: true
          prompt-file: agent-task.md
      - name: Validate generated changes and run tests
        if: env.HAS_OPENAI_KEY == 'true'
        id: validate
        run: |
          rm -f agent-task.md
          python "$RUNNER_TEMP/agent_queue_guard.py" validate \
            --repo . --patch-output "$RUNNER_TEMP/agent.patch"
          if [[ ! -s "$RUNNER_TEMP/agent.patch" ]]; then
            echo "::notice::Codex reported no safe changes. Skipping PR."
            exit 0
          fi
          python -m compileall -q factory tests
          python -m unittest discover -s tests -v
          python -m factory.cli --fixture tests/fixtures/search.json --output-dir smoke
          echo "patch_ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.validate.outputs.patch_ready == 'true'
        with:
          name: validated-codex-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/agent.patch
          if-no-files-found: error
          retention-days: 7

  publish-draft:
    needs: [select, generate]
    if: needs.generate.outputs.patch_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: validated-codex-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/validated/
      - name: Revalidate patch without executing generated code
        env:
          ISSUE_NUMBER: ${{ needs.select.outputs.issue_number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          BRANCH="agent/issue-${ISSUE_NUMBER}-${RUN_ID}"
          git switch -c "$BRANCH"
          git apply --check "$RUNNER_TEMP/validated/agent.patch"
          git apply "$RUNNER_TEMP/validated/agent.patch"
          python -m factory.agent_queue validate \
            --repo . --patch-output "$RUNNER_TEMP/revalidated.patch"
          cmp "$RUNNER_TEMP/validated/agent.patch" "$RUNNER_TEMP/revalidated.patch"
          git add -- factory/ tests/ docs/ research/
          git diff --cached --check
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(agent): proposed fix for issue #${ISSUE_NUMBER}"
          git push origin "$BRANCH"
          {
            echo "Automated **draft** implementation for issue #${ISSUE_NUMBER}."
            echo
            echo "Source: https://github.com/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}"
            echo "Generator: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
            echo
            echo "The generation job validated the patch scope and passed the Python test suite."
            echo "This change is **not approved or merged**. Review security, correctness and CI."
            echo "No package or stable release was published."
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --draft \
            --base main \
            --head "$BRANCH" \
            --title "Agent proposal for issue #${ISSUE_NUMBER}" \
            --body-file "$RUNNER_TEMP/pr-body.md"
          gh workflow run quality.yml --ref "$BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
