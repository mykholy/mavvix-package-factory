name: FailureLab pre-alpha PHP & Laravel compatibility

on:
  pull_request:
    paths:
      - 'packages/laravel-failurelab/**'
      - '.github/workflows/failurelab-tests.yml'
  push:
    branches: [main]
    paths:
      - 'packages/laravel-failurelab/**'
      - '.github/workflows/failurelab-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.3', laravel: '^12.0', testbench: '^10.0' }
          - { php: '8.4', laravel: '^12.0', testbench: '^10.0' }
          - { php: '8.4', laravel: '^13.0', testbench: '^11.0' }
          - { php: '8.5', laravel: '^13.0', testbench: '^11.0' }

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    defaults:
      run:
        working-directory: packages/laravel-failurelab
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: mbstring, dom, sqlite3, pdo_sqlite, fileinfo
      - name: Validate standalone package metadata
        run: composer validate --no-check-publish
      - name: Select supported Laravel/Testbench combination
        run: composer require --dev --no-interaction --no-update "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}"
      - name: Resolve and install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Syntax validation
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHPUnit integration and recovery tests
        run: composer test
      - name: Pint formatting check (PHP 8.4/Laravel 13)
        if: matrix.php == '8.4' && matrix.laravel == '^13.0'
        run: composer format:check

  source-archive:
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Create clean Composer package archive
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar --prefix=laravel-failurelab/ HEAD:packages/laravel-failurelab | gzip -9 > dist/laravel-failurelab-prealpha.tar.gz
          tar -tzf dist/laravel-failurelab-prealpha.tar.gz | grep -q 'laravel-failurelab/composer.json'
      - uses: actions/upload-artifact@v4
        with:
          name: laravel-failurelab-source-${{ github.sha }}
          path: dist/laravel-failurelab-prealpha.tar.gz
          if-no-files-found: error
          retention-days: 30
